<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Embodied Daily · 每日具身智能论文</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <div class="container">
    <div class="header-inner">
      <div class="logo">
        <div class="logo-badge" style="background:linear-gradient(135deg,#10b981,#3b82f6)">ED</div>
        <span>Embodied Daily</span>
      </div>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchInput" type="search" placeholder="搜索论文、作者、关键词..." />
      </div>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="latest">最新<span class="count" id="latestCount">0</span></button>
        <button class="tab" data-tab="archive">往期<span class="count" id="archiveCountBadge">0</span></button>
        <button class="tab" data-tab="feed">精选<span class="count" id="classicsCount">0</span></button>
        <button class="tab" data-tab="bookmarks">收藏<span class="count" id="bmCount">0</span></button>
      </nav>
    </div>
  </div>
</header>

<main class="container">
  <aside class="sidebar">
    <div class="filter-section">
      <h3>主题分类</h3>
      <div class="chips" id="tagChips"></div>
    </div>
    <div class="filter-section">
      <h3>年份</h3>
      <div class="chips" id="yearChips"></div>
    </div>
    <button id="resetFilters" class="ghost-btn">清除筛选</button>
  </aside>

  <section class="content">
    <div id="latestPane" class="active">
      <div class="section-header">
        <h2>最新论文</h2>
        <span class="meta" id="latestMeta"></span>
      </div>
      <div class="paper-list" id="latestList"></div>
    </div>

    <div id="archivePane" class="hidden">
      <div class="section-header">
        <h2>往期论文</h2>
        <span class="meta" id="archiveMeta"></span>
      </div>
      <div id="archiveList"></div>
    </div>

    <div id="feedPane" class="hidden">
      <div class="section-header">
        <h2>经典论文</h2>
        <span class="meta" id="feedMeta"></span>
      </div>
      <div class="paper-list" id="feedList"></div>
    </div>

    <div id="bookmarksPane" class="hidden">
      <div class="section-header">
        <h2>我的收藏</h2>
        <span class="meta" id="bmMeta"></span>
      </div>
      <div class="paper-list" id="bookmarksList"></div>
    </div>
  </section>
</main>

<script src="papers.js"></script>
<script src="data/data.js"></script>
<script src="app.js"></script>
</body>
</html>

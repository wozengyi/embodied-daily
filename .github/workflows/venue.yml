name: Venue Metadata Enrichment

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      max_papers:
        description: 'Maximum papers to query from Semantic Scholar'
        required: false
        default: '40'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enrich venue metadata
        run: |
          MAX_PAPERS="${{ github.event.inputs.max_papers || '40' }}"
          python build/enrich_venues.py --max-papers "$MAX_PAPERS"

      - name: Validate generated data
        run: python build/validate_data.py

      - name: Commit enriched metadata
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No venue metadata changes."
          else
            git commit -m "chore: enrich venue metadata $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: enrich
    if: github.ref == 'refs/heads/main' && needs.enrich.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync latest enriched data
        run: git pull --ff-only origin main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
